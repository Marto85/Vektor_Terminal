<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#252526" />
    <link rel="icon" type="image/svg+xml" href="/vektor-favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Vektor — Equity Research Terminal</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("vektor_theme") || "system";
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = saved === "dark" || (saved === "system" && prefersDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", isDark ? "#18181b" : "#252526");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
